name: Promote to Latest

# Triggers when termux_verified promotion is pushed to main.
# Checks if the latest_audited_version in manifest differs from the registry
# `latest` dist-tag, and if so runs a retag (not a re-publish).
# The check job runs without an approval gate; the promote job (which writes
# to npm) only runs and requests the gate when retag is actually needed.

concurrency:
  group: npm-promote
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "config/claude-native-audited-versions.json"
      - "packages/claude-code/config/claude-native-audited-versions.json"
      - "config/claude-termux-release-manifest.json"
      - "packages/claude-code/config/claude-termux-release-manifest.json"
      - "packages/claude-code/package.json"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      latest_audited: ${{ steps.check.outputs.latest_audited }}
      registry_latest: ${{ steps.check.outputs.registry_latest }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Check if retag needed
        id: check
        run: |
          set -eu
          latest_audited=$(node -p "require('./config/claude-termux-release-manifest.json').latest_audited_version")
          status=$(node -e "
            const c = require('./config/claude-native-audited-versions.json');
            const v = c.versions['${latest_audited}'];
            process.stdout.write(v ? v.status : 'unknown');
          ")
          registry_latest=$(npm view @bash0816/claude-code dist-tags.latest 2>/dev/null || echo "")

          echo "latest_audited=${latest_audited}" >> "$GITHUB_OUTPUT"
          echo "registry_latest=${registry_latest}" >> "$GITHUB_OUTPUT"

          if [ "$status" != "termux_verified" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Status=${status} (not termux_verified) — skip"
          elif [ "$registry_latest" = "$latest_audited" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Registry latest already at ${latest_audited} — skip"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Retag needed: ${registry_latest} → ${latest_audited}"
          fi

  promote:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Retag latest
        working-directory: packages/claude-code
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CLAUDE_TERMUX_EXPECTED_PREVIOUS_AUDITED_VERSION: ${{ needs.check.outputs.registry_latest }}
        run: |
          set -eu
          node ../../scripts/retag-latest-dist-tags.js
          echo "Retagged: latest → ${{ needs.check.outputs.latest_audited }}"

      - name: Dispatch release-finalize
        run: |
          set -eu
          ver="${{ needs.check.outputs.latest_audited }}"
          gh workflow run release-finalize.yml \
            --repo "$GITHUB_REPOSITORY" \
            --field version="${ver}"
          echo "Dispatched release-finalize for ${ver}"
