name: npm package (verify)

# Publish is handled by the private repo workflow (bash0816/CluadeCode-Termux-private).
# This workflow runs verify-only on PRs and pushes.

on:
  pull_request:
    paths:
      - "README.md"
      - "packages/claude-code/**"
      - "packages/claude-code/README.md"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/npm-package.yml"
  push:
    branches:
      - main
      - dev
      - staging
    paths:
      - "README.md"
      - "packages/claude-code/**"
      - "packages/claude-code/README.md"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/npm-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/claude-code
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        run: |
          set -euo pipefail
          sh -n bin/claude
          sh -n lib/termux-run-claude-native.sh
          node --check lib/prepare-native.js
          node --check lib/check-updates.js
          node --check lib/postinstall.js
          node --check lib/preinstall.js
          node --check ../../scripts/update-readme-version-guidance.js
          node --check ../../scripts/update-release-manifest.js
          node --check ../../scripts/promote-verified-version.js

      - name: Verify audited metadata
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const config = JSON.parse(fs.readFileSync('config/claude-native-audited-versions.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('config/claude-termux-release-manifest.json', 'utf8'));
          if (pkg.name !== '@bash0816/claude-code') throw new Error('unexpected package name');
          if (pkg.version !== manifest.latest_audited_version) {
            throw new Error(`package version ${pkg.version} does not match manifest latest audited ${manifest.latest_audited_version}`);
          }
          NODE

      - name: Verify release manifest
        run: |
          set -euo pipefail
          node ../../scripts/update-release-manifest.js
          node ../../scripts/update-readme-version-guidance.js
          git diff --exit-code -- ../../README.md README.md config/claude-native-audited-versions.json config/claude-termux-release-manifest.json

      - name: Pack dry run
        run: npm pack --dry-run
