name: Npm Package

on:
  pull_request:
    paths:
      - "README.md"
      - "packages/claude-code/**"
      - "packages/claude-code/README.md"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/npm-package.yml"
  push:
    branches:
      - main
      - dev
      - staging
    paths:
      - "README.md"
      - "packages/claude-code/**"
      - "packages/claude-code/README.md"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/npm-package.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish @bash0816/claude-code to npm"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      package_version:
        description: "Optional package.json version override for historical publishes"
        required: false
        default: ""
      npm_tag:
        description: "npm dist-tag to use when publishing"
        required: false
        default: "latest"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/claude-code
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Set dispatch package version
        if: github.event_name == 'workflow_dispatch' && inputs.package_version != ''
        run: |
          set -euo pipefail
          version="${{ inputs.package_version }}"
          node - <<'NODE' "${version}"
          const fs = require('fs');
          const version = process.argv[2];
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const config = JSON.parse(fs.readFileSync('config/claude-native-audited-versions.json', 'utf8'));
          if (!config.versions[version]) {
            throw new Error(`cannot publish unaudited version ${version}`);
          }
          pkg.version = version;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Syntax check
        run: |
          set -euo pipefail
          sh -n bin/claude
          sh -n lib/termux-run-claude-native.sh
          node --check lib/prepare-native.js
          node --check lib/check-updates.js
          node --check lib/postinstall.js
          node --check lib/preinstall.js
          node --check ../../scripts/update-readme-version-guidance.js
          node --check ../../scripts/update-release-manifest.js
          node --check ../../scripts/promote-verified-version.js

      - name: Verify audited metadata
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const config = JSON.parse(fs.readFileSync('config/claude-native-audited-versions.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('config/claude-termux-release-manifest.json', 'utf8'));
          for (const version of ['2.1.118', '2.1.119', '2.1.121', '2.1.122']) {
            const item = config.versions[version];
            if (!item) throw new Error(`missing audited version ${version}`);
            for (const field of ['native_spec', 'entry_js_offset', 'entry_end_offset']) {
              if (!item[field]) throw new Error(`missing ${field} for ${version}`);
            }
          }
          if (pkg.name !== '@bash0816/claude-code') throw new Error('unexpected package name');
          if (pkg.version !== manifest.latest_audited_version) {
            throw new Error(`package version ${pkg.version} does not match manifest latest audited ${manifest.latest_audited_version}`);
          }
          NODE

      - name: Verify release manifest
        run: |
          set -euo pipefail
          node ../../scripts/update-release-manifest.js
          node ../../scripts/update-readme-version-guidance.js
          git diff --exit-code -- ../../README.md README.md config/claude-native-audited-versions.json config/claude-termux-release-manifest.json

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Publish
        if: github.event_name == 'workflow_dispatch' && inputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ inputs.npm_tag || 'latest' }}
        run: |
          set -euo pipefail
          npm publish --access public --tag "${NPM_TAG}"
