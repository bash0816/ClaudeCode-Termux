name: Npm Package

# This workflow verifies on PRs and pushes, and can publish on workflow_dispatch
# when explicitly requested.

on:
  pull_request:
    paths:
      - "README.md"
      - "RELEASES.md"
      - "packages/claude-code/**"
      - "packages/claude-code/README.md"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/npm-package.yml"
  push:
    branches:
      - main
      - dev
      - staging
    paths:
      - "README.md"
      - "RELEASES.md"
      - "packages/claude-code/**"
      - "packages/claude-code/README.md"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/npm-package.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish @bash0816/claude-code to npm"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      retag_latest:
        description: "Update npm latest dist-tag without publishing a new package"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      previous_audited_version:
        description: "Previous audited version to restore to candidate during retag"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/claude-code
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Syntax check
        run: |
          set -euo pipefail
          sh -n bin/claude
          sh -n lib/termux-run-claude-native.sh
          node --check lib/prepare-native.js
          node --check lib/check-updates.js
          node --check lib/postinstall.js
          node --check lib/preinstall.js
          node --check ../../scripts/update-readme-version-guidance.js
          node --check ../../scripts/update-release-manifest.js
          node --check ../../scripts/promote-verified-version.js
          node --check ../../scripts/retag-latest-dist-tags.js
          node --test ../../scripts/retag-latest-dist-tags.test.js

      - name: Verify audited metadata
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const config = JSON.parse(fs.readFileSync('config/claude-native-audited-versions.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('config/claude-termux-release-manifest.json', 'utf8'));
          const auditedVersion = manifest.latest_audited_version;
          const candidateVersion = manifest.latest_candidate_version || '';
          const packageVersion = pkg.version;
          const audited = config.versions[auditedVersion];
          const candidate = candidateVersion ? config.versions[candidateVersion] : null;
          if (pkg.name !== '@bash0816/claude-code') throw new Error('unexpected package name');
          if (packageVersion === auditedVersion) {
            if (!audited) throw new Error(`missing audited metadata for ${auditedVersion}`);
            if (audited.status !== 'termux_verified') {
              throw new Error(`latest audited version ${auditedVersion} is not termux_verified`);
            }
          } else if (packageVersion === candidateVersion) {
            if (!candidate) throw new Error(`missing candidate metadata for ${candidateVersion}`);
            if (!['offset_discovered', 'termux_verified'].includes(candidate.status)) {
              throw new Error(`latest candidate version ${candidateVersion} has unsupported status ${candidate.status}`);
            }
          } else {
            throw new Error(`package version ${packageVersion} does not match audited ${auditedVersion} or candidate ${candidateVersion}`);
          }
          NODE

      - name: Verify release manifest
        run: |
          set -euo pipefail
          node ../../scripts/update-release-manifest.js
          node ../../scripts/update-readme-version-guidance.js
          git diff --exit-code -- config/claude-native-audited-versions.json config/claude-termux-release-manifest.json
          if ! git diff --quiet -- ../../README.md README.md; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "ERROR: README is out of sync with manifest" >&2
              git diff -- ../../README.md README.md
              exit 1
            else
              echo "WARNING: README has pending version update (release-finalize PR will fix this)"
              git diff -- ../../README.md README.md
            fi
          fi

      - name: Pack dry run
        run: npm pack --dry-run

  publish:
    if: github.event_name == 'workflow_dispatch' && (inputs.publish == 'true' || inputs.retag_latest == 'true')
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/claude-code
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Validate dispatch mode
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          node - <<'NODE'
          const publish = process.env.INPUT_PUBLISH === 'true';
          const retagLatest = process.env.INPUT_RETAG_LATEST === 'true';
          if (publish && retagLatest) {
            throw new Error('publish and retag_latest cannot both be true');
          }
          if (retagLatest && !process.env.INPUT_PREVIOUS_AUDITED_VERSION) {
            throw new Error('previous_audited_version is required when retag_latest is true');
          }
          NODE
        env:
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_RETAG_LATEST: ${{ inputs.retag_latest }}
          INPUT_PREVIOUS_AUDITED_VERSION: ${{ inputs.previous_audited_version }}

      - name: Publish guard
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const { execSync } = require('child_process');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const config = JSON.parse(fs.readFileSync('config/claude-native-audited-versions.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('config/claude-termux-release-manifest.json', 'utf8'));
          const auditedVersion = manifest.latest_audited_version;
          const candidateVersion = manifest.latest_candidate_version || '';
          const audited = config.versions[auditedVersion];
          const candidate = candidateVersion ? config.versions[candidateVersion] : null;
          if (pkg.name !== '@bash0816/claude-code') throw new Error('unexpected package name');
          if (pkg.version === auditedVersion) {
            if (!audited) throw new Error(`missing audited metadata for ${auditedVersion}`);
            if (audited.status !== 'termux_verified') {
              throw new Error(`latest audited version ${auditedVersion} is not termux_verified`);
            }
          } else if (pkg.version === candidateVersion) {
            if (!candidate) throw new Error(`missing candidate metadata for ${candidateVersion}`);
            if (!['offset_discovered', 'termux_verified'].includes(candidate.status)) {
              throw new Error(`latest candidate version ${candidateVersion} has unsupported status ${candidate.status}`);
            }
          } else {
            throw new Error(`package version ${pkg.version} does not match audited ${auditedVersion} or candidate ${candidateVersion}`);
          }

          const packInfo = JSON.parse(execSync('npm pack --dry-run --json', { encoding: 'utf8' }));
          const pack = Array.isArray(packInfo) ? packInfo[0] : packInfo;
          const files = (pack && pack.files) || [];
          const unexpected = [];
          for (const file of files) {
            const path = String(file.path || '').replace(/^\.\//, '');
            if (path === 'package.json' || path === 'README.md' || path === 'LICENSE') continue;
            if (path.startsWith('bin/') || path.startsWith('lib/') || path.startsWith('config/')) continue;
            unexpected.push(path);
          }
          if (unexpected.length) {
            throw new Error(`unexpected files in npm pack: ${unexpected.join(', ')}`);
          }
          NODE

      - name: Publish package
        if: github.event_name == 'workflow_dispatch' && inputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm_tag="$(node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('config/claude-termux-release-manifest.json', 'utf8'));
          const auditedVersion = manifest.latest_audited_version;
          const candidateVersion = manifest.latest_candidate_version || '';
          if (pkg.version === candidateVersion) {
            process.stdout.write('candidate');
          } else if (pkg.version === auditedVersion) {
            process.stdout.write('latest');
          } else {
            throw new Error(`package version ${pkg.version} does not match audited ${auditedVersion} or candidate ${candidateVersion}`);
          }
          NODE
          )"
          npm publish --access public --tag "${npm_tag}"

      - name: Retag guard
        if: github.event_name == 'workflow_dispatch' && inputs.retag_latest == 'true'
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const config = JSON.parse(fs.readFileSync('config/claude-native-audited-versions.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('config/claude-termux-release-manifest.json', 'utf8'));
          const expectedPreviousAuditedVersion = process.env.CLAUDE_TERMUX_EXPECTED_PREVIOUS_AUDITED_VERSION || '';
          const candidateVersion = manifest.latest_candidate_version || '';
          const previousLatest = JSON.parse(require('child_process').execSync('npm view @bash0816/claude-code dist-tags --json', { encoding: 'utf8' })).latest || '';
          const previousCandidate = JSON.parse(require('child_process').execSync('npm view @bash0816/claude-code dist-tags --json', { encoding: 'utf8' })).candidate || '';
          const candidate = candidateVersion ? config.versions[candidateVersion] : null;
          if (!expectedPreviousAuditedVersion) {
            throw new Error('missing expected previous audited version');
          }
          if (previousLatest !== expectedPreviousAuditedVersion) {
            throw new Error(`registry latest ${previousLatest} does not match expected previous audited ${expectedPreviousAuditedVersion}`);
          }
          if (pkg.version !== candidateVersion) {
            throw new Error(`package version ${pkg.version} does not match candidate ${candidateVersion}`);
          }
          if (previousCandidate !== pkg.version) {
            throw new Error(`registry candidate ${previousCandidate} does not match package ${pkg.version}`);
          }
          if (!candidate) {
            throw new Error(`missing candidate metadata for ${candidateVersion}`);
          }
          if (candidate.status !== 'termux_verified') {
            throw new Error(`candidate version ${candidateVersion} is not termux_verified`);
          }
          NODE
        env:
          CLAUDE_TERMUX_EXPECTED_PREVIOUS_AUDITED_VERSION: ${{ inputs.previous_audited_version }}

      - name: Retag latest
        if: github.event_name == 'workflow_dispatch' && inputs.retag_latest == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CLAUDE_TERMUX_EXPECTED_PREVIOUS_AUDITED_VERSION: ${{ inputs.previous_audited_version }}
        run: |
          node ../../scripts/retag-latest-dist-tags.js
