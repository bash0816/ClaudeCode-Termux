name: Release Finalize

# NOTE(2026-07-16): trivial touch to force GitHub Actions to re-index the
# workflow_dispatch trigger, which was returning HTTP 422
# "Workflow does not have 'workflow_dispatch' trigger" despite this file
# already declaring it. No behavioral change.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 2.1.177-1)"
        required: true
      release_notes:
        description: "Public release summary — EN/JA highlights (leave empty for stub)"
        required: false
        default: ""
      release_date:
        description: "RELEASES.md entry date (YYYY-MM-DD, leave empty for JST today)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      VER: ${{ inputs.version }}
      NOTES: ${{ inputs.release_notes }}
      RELEASE_DATE: ${{ inputs.release_date }}
    steps:
      - name: Validate version format
        run: |
          set -eu
          echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$' || {
            echo "ERROR: Invalid version format: $VER" >&2
            exit 1
          }
          echo "Version format OK: $VER"

      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify npm publish exists
        run: |
          set -eu
          published=$(npm view "@bash0816/claude-code@${VER}" version 2>/dev/null || echo "")
          if [ "$published" != "$VER" ]; then
            echo "ERROR: @bash0816/claude-code@${VER} not published on npm" >&2
            exit 1
          fi
          echo "Confirmed: @bash0816/claude-code@${VER} is published"

      - name: Validate repo metadata
        run: |
          set -eu
          root_ver=$(node -e "process.stdout.write(require('./config/claude-termux-release-manifest.json').latest_audited_version)")
          pkg_ver=$(node -e "process.stdout.write(require('./packages/claude-code/package.json').version)")
          pkg_manifest_ver=$(node -e "process.stdout.write(require('./packages/claude-code/config/claude-termux-release-manifest.json').latest_audited_version)")
          if [ "$root_ver" != "$VER" ] || [ "$pkg_ver" != "$VER" ] || [ "$pkg_manifest_ver" != "$VER" ]; then
            echo "ERROR: metadata version mismatch vs input $VER" >&2
            echo "  root manifest:  $root_ver" >&2
            echo "  package.json:   $pkg_ver" >&2
            echo "  pkg manifest:   $pkg_manifest_ver" >&2
            exit 1
          fi
          status=$(node -e "
            const c = require('./config/claude-native-audited-versions.json');
            const v = c.versions['$VER'];
            process.stdout.write(v ? v.status : 'not_found');
          ")
          if [ "$status" != "termux_verified" ]; then
            echo "ERROR: $VER status=$status (expected termux_verified)" >&2
            exit 1
          fi
          echo "OK: all metadata consistent for $VER (termux_verified)"

      - name: Update README
        run: |
          set -eu
          node scripts/update-readme-version-guidance.js
          echo "README updated"

      - name: Update RELEASES.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ -n "${RELEASE_DATE:-}" ]; then
            echo "$RELEASE_DATE" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || {
              echo "ERROR: invalid release_date format: $RELEASE_DATE" >&2; exit 1
            }
            date_str="$RELEASE_DATE"
          else
            date_str=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          fi
          previous_stable=$(node -e "process.stdout.write(require('./config/claude-termux-release-manifest.json').previous_stable_version || '')")
          notes="${NOTES:-}"
          if [ -z "$notes" ]; then
            upstream_tag="v${VER}"
            upstream_body=$(gh api "repos/anthropics/claude-code/releases/tags/${upstream_tag}" --jq '.body' 2>/dev/null || echo "")
            if [ -n "$upstream_body" ]; then
              notes=$(printf 'upstream claude-code %s 追従。Termux 実機検証済み（全テスト通過 / TUI 起動確認）。\n\n**Upstream highlights / 主な変更（upstream）**\n\n%s' \
                "$VER" "$upstream_body")
            else
              notes=$(printf 'upstream claude-code %s 追従。Termux 実機検証済み（全テスト通過 / TUI 起動確認）。' \
                "$VER")
            fi
          fi
          rollback_line=""
          if [ -n "$previous_stable" ]; then
            rollback_line=$(printf '\n```sh\nnpm install -g @bash0816/claude-code@%s\n```' "$previous_stable")
          fi
          # Use ## VER (with trailing space) to avoid partial match (e.g. 2.1.177 matching 2.1.177-1)
          if grep -qF "## ${VER} " RELEASES.md; then
            echo "RELEASES.md already has ${VER} entry, skipping"
          else
            entry=$(cat <<RELNOTES_EOF_9f3a2b
          ## ${VER} — ${date_str} ✅ Current audited / 現在の監査済み版

          ${notes}

          \`\`\`sh
          npm install -g @bash0816/claude-code@latest
          \`\`\`
          ${rollback_line}

          ---

          RELNOTES_EOF_9f3a2b
          )
            printf '%s\n' "$entry" > /tmp/new_entry.md
            cat /tmp/new_entry.md RELEASES.md > /tmp/releases_new.md
            mv /tmp/releases_new.md RELEASES.md
            echo "RELEASES.md prepended with ${VER} stub"
          fi

      - name: Commit and create PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          branch="automation/docs-${VER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add README.md packages/claude-code/README.md RELEASES.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: update README and RELEASES for ${VER}"
          git push --force-with-lease origin "$branch" || git push --force origin "$branch"
          existing_pr=$(gh pr list --base main --head "$branch" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing_pr" ]; then
            echo "PR #${existing_pr} already exists for ${branch}"
          else
            pr_body_file=$(mktemp)
            trap 'rm -f "$pr_body_file"' EXIT
            printf "Automated docs update for @bash0816/claude-code@%s.\n\n**TODO before merging:**\n- [ ] RELEASES.md の upstream highlights を追記する\n- [ ] GitHub Release のノートを編集する（マージ後に \`gh release edit v%s\` で更新可）\n" "$VER" "$VER" > "$pr_body_file"
            pr_url=$(gh pr create --base main --head "$branch" \
              --title "docs: update README and RELEASES for ${VER}" \
              --body-file "$pr_body_file")
            echo "PR created: $pr_url"
          fi

      - name: Merge docs PR (admin bypass)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_PAT }}
        run: |
          set -eu
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ERROR: RELEASE_ADMIN_PAT secret is not set" >&2
            exit 1
          fi
          branch="automation/docs-${VER}"
          pr_num=$(gh pr list --repo bash0816/ClaudeCode-Termux \
            --base main --head "$branch" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$pr_num" ]; then
            gh pr merge "$pr_num" --repo bash0816/ClaudeCode-Termux --admin --squash --delete-branch
            echo "Docs PR #${pr_num} merged (admin bypass)"
          else
            echo "No open docs PR found, skipping"
          fi
