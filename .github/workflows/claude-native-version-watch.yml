name: Claude Native Version Watch

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Claude Code version or @latest"
        required: false
        default: "@latest"
  schedule:
    - cron: "0 19 * * *"

permissions:
  contents: read

jobs:
  check-native-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          requested="${{ github.event.inputs.version || '@latest' }}"
          case "${requested}" in
            @latest|latest) version="$(npm view @anthropic-ai/claude-code version)" ;;
            @anthropic-ai/claude-code@*) version="${requested##*@}" ;;
            @*) version="${requested#@}" ;;
            *) version="${requested}" ;;
          esac
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check audited version status
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("config/claude-native-audited-versions.json","utf8")); if (!j.versions[process.argv[1]]) { process.exit(1); }' "${version}"
